# pubspec.yaml
name: abasto
description: "Plataforma B2B para restaurantes y proveedores de alimentos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.4
  http: ^1.2.0
  url_launcher: ^6.3.0
  google_fonts: ^8.2.1
  image_picker_for_web: ^3.1.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/